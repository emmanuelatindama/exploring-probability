<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine tests — Exploring Probability</title>
<style>
  :root {
    color-scheme: light dark;
    --surface: #fcfcfb; --ink: #0b0b0b; --dim: #52514e; --line: #e1e0d9;
    --ok: #0ca30c; --bad: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --surface: #1a1a19; --ink: #fff; --dim: #c3c2b7; --line: #2c2c2a; }
  }
  body {
    margin: 0; background: var(--surface); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px 24px 64px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--dim); margin: 0 0 24px; }
  #summary { font-size: 16px; font-weight: 600; padding: 12px 0 18px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) {
    text-align: left; font-variant-numeric: normal;
  }
  thead th { color: var(--dim); font-weight: 500; }
  .pass { color: var(--ok); font-weight: 600; }
  .fail { color: var(--bad); font-weight: 600; }
  tr.group td { padding-top: 18px; font-weight: 600; border-bottom: none; }
  code { font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Engine tests</h1>
  <p class="sub">
    Checks <code>js/engine.js</code> against golden values generated by
    <code>lab/analytics.py</code> (regenerate with <code>python lab/verify.py</code>).
    The PRNG must match exactly — the two implementations only produce the same
    trajectories if the port is bit-for-bit correct.
  </p>
  <div id="summary">Running…</div>
  <table>
    <thead>
      <tr><th>#</th><th>Check</th><th>Got</th><th>Want</th><th>Δ (rel)</th><th>Result</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script src="js/engine.js"></script>
<script src="js/golden.js"></script>
<script>
(function () {
  "use strict";
  const G = window.EP_GOLDEN;
  const rows = document.getElementById("rows");
  let n = 0, passed = 0, failed = 0;

  const td = (text, cls) => {
    const c = document.createElement("td");
    c.textContent = text;
    if (cls) c.className = cls;
    return c;
  };

  function group(label) {
    const tr = document.createElement("tr");
    tr.className = "group";
    const c = document.createElement("td");
    c.colSpan = 6;
    c.textContent = label;
    tr.appendChild(c);
    rows.appendChild(tr);
  }

  const fmt = (v) =>
    typeof v !== "number" ? String(v)
      : !isFinite(v) ? String(v)
      : (Math.abs(v) >= 1e6 || (Math.abs(v) > 0 && Math.abs(v) < 1e-4))
        ? v.toExponential(10) : String(Number(v.toPrecision(12)));

  /** relTol compares relatively; absTol absolutely; exact demands equality. */
  function check(label, got, want, opts) {
    opts = opts || {};
    n++;
    let ok, delta;
    if (opts.exact) {
      ok = got === want;
      delta = ok ? 0 : NaN;
    } else if (opts.absTol !== undefined) {
      delta = Math.abs(got - want);
      ok = delta <= opts.absTol;
    } else {
      const tol = opts.relTol !== undefined ? opts.relTol : 1e-9;
      const scale = Math.max(Math.abs(want), Number.MIN_VALUE);
      delta = Math.abs(got - want) / scale;
      ok = delta <= tol;
      if (!isFinite(want) && want === got) { ok = true; delta = 0; }
    }
    ok ? passed++ : failed++;

    const tr = document.createElement("tr");
    tr.appendChild(td(String(n)));
    tr.appendChild(td(label));
    tr.appendChild(td(fmt(got)));
    tr.appendChild(td(fmt(want)));
    tr.appendChild(td(isFinite(delta) ? delta.toExponential(2) : "—"));
    tr.appendChild(td(ok ? "PASS" : "FAIL", ok ? "pass" : "fail"));
    rows.appendChild(tr);
    if (!ok) console.error(`FAIL ${label}: got`, got, "want", want);
  }

  // -- 1. PRNG: must be bit-for-bit identical to the Python port -------------
  group("PRNG (mulberry32) — exact match required");
  for (const seed of Object.keys(G.prng)) {
    const rand = EP.mulberry32(Number(seed));
    G.prng[seed].forEach((want, i) => {
      check(`seed ${seed}, draw ${i + 1}`, rand(), want, { exact: true });
    });
  }

  // -- 2. binomial helpers ---------------------------------------------------
  group("Binomial pmf / cdf vs scipy");
  for (const b of G.binom) {
    check(`pmf(k=${b.k}, n=${b.n}, p=${b.p})`, EP.binomPmf(b.k, b.n, b.p), b.pmf,
          { relTol: 1e-10 });
    check(`cdf(k=${b.k}, n=${b.n}, p=${b.p})`, EP.binomCdf(b.k, b.n, b.p), b.cdf,
          { relTol: 1e-10 });
  }

  // -- 3. closed-form analytics ---------------------------------------------
  for (const c of G.cases) {
    const p = c.params;
    group(`Analytics — rounds=${p.rounds} p=${p.p} up=${p.up} down=${p.down} f=${p.f}`);
    const got = EP.summary(p);
    for (const key of Object.keys(c.expect)) {
      // Probabilities get an absolute tolerance: some are ~1e-9, where a
      // relative bar would just measure floating-point noise.
      const isProb = key === "pBelowStart" || key === "pBelowOne";
      check(key, got[key], c.expect[key],
            isProb ? { absTol: 1e-10 } : { relTol: 1e-9 });
    }
  }

  // -- 4. seeded simulation: the PRNG port end to end -----------------------
  group("Seeded simulation — terminal wealth must reproduce exactly");
  const cfg = G.sim.config;
  const sim = EP.simulatePaths(cfg);
  G.sim.terminal.forEach((want, i) => {
    check(`path ${i + 1} terminal`, sim.terminal[i], want, { relTol: 1e-12 });
  });
  G.sim.firstPath.forEach((want, t) => {
    check(`path 1, round ${t}`, sim.paths[t], want, { relTol: 1e-12 });
  });

  // -- 5. gambler's ruin ----------------------------------------------------
  for (const c of G.ruin) {
    const p = c.params;
    group(`Gambler's ruin — $${p.bankroll} → $${p.target}, $${p.bet} bets, p=${p.p}`);
    const got = EP.ruinSummary(p);
    for (const key of Object.keys(c.expect)) {
      const isProb = /Prob|Unbounded/.test(key);
      check(key, got[key], c.expect[key],
            isProb ? { absTol: 1e-12 } : { relTol: 1e-9 });
    }
    // Absorption is certain: the two exits must exhaust the probability.
    check("ruin + reach = 1", got.ruinProb + got.reachProb, 1, { absTol: 1e-12 });
  }

  group("Seeded ruin walk — absorbing barriers must line up exactly");
  const rcfg = G.ruinSim.config;
  const rsim = EP.simulateRuin(rcfg);
  check("k (start, in bets)", rsim.k, G.ruinSim.k, { exact: true });
  check("n (target, in bets)", rsim.n, G.ruinSim.n, { exact: true });
  G.ruinSim.terminal.forEach((want, i) => {
    check(`walk ${i + 1} terminal`, rsim.terminal[i], want, { exact: true });
  });
  G.ruinSim.firstPath.forEach((want, t) => {
    check(`walk 1, round ${t}`, rsim.paths[t], want, { exact: true });
  });

  // -- 6. St Petersburg -----------------------------------------------------
  for (const c of G.stpete) {
    const p = c.params;
    group(`St Petersburg — p=${p.p}, m=${p.m}, cap ${p.tiers} tosses (m·p=${(p.m * p.p).toFixed(2)})`);
    const got = EP.spSummary(p);
    // The two tier-indexed values are not summary fields -- they are the
    // per-tier functions the octave chart calls, so check them at their source.
    const TIER_KEYS = { survival5: 1, contribution5: 1 };
    for (const key of Object.keys(c.expect)) {
      if (TIER_KEYS[key]) continue;
      // `expected` is +Infinity for the divergent cases; check() handles that
      // via its non-finite equality branch.
      check(key, got[key], c.expect[key], { relTol: 1e-9 });
    }
    check("survival(tier 5)", EP.spSurvival(5, p.p), c.expect.survival5,
          { relTol: 1e-9 });
    check("tierContribution(tier 5)", EP.spTierContribution(5, p.p, p.m),
          c.expect.contribution5, { relTol: 1e-9 });
  }

  group("Seeded St Petersburg play-out — payout draws must reproduce exactly");
  const spcfg = G.stpeteSim.config;
  const spsim = EP.simulateStPetersburg(spcfg);
  G.stpeteSim.firstPayouts.forEach((want, i) => {
    check(`payout ${i + 1}`, spsim.firstPayouts[i], want, { exact: true });
  });
  G.stpeteSim.means.forEach((want, i) => {
    check(`run ${i + 1} mean over ${spcfg.plays} plays`, spsim.means[i], want,
          { relTol: 1e-12 });
  });

  // -- 7. iterated prisoner's dilemma ---------------------------------------
  for (const c of G.pd) {
    const p = c.params;
    group(`Prisoner's dilemma — ${p.rounds} rounds, T=${p.t}, noise=${p.noise}`);
    const got = EP.pdSummary(p);
    G.strategies.forEach((si, i) => {
      G.strategies.forEach((sj, j) => {
        check(`A[${si}][${sj}]`, got.matrix[i][j], c.expect.matrix[i][j],
              { relTol: 1e-9 });
      });
    });
    c.expect.scores.forEach((want, i) => {
      check(`score ${G.strategies[i]}`, got.scores[i], want, { relTol: 1e-9 });
    });
    check("tournament winner", got.winner, c.expect.winner, { exact: true });
    check("TFT vs ALLD", got.tftVsAlld, c.expect.tftVsAlld, { relTol: 1e-9 });
    check("ALLD vs TFT", got.alldVsTft, c.expect.alldVsTft, { relTol: 1e-9 });
    c.expect.finalShares.forEach((want, i) => {
      check(`share after ${p.generations} gens — ${G.strategies[i]}`,
            got.shares[got.shares.length - 1][i], want, { absTol: 1e-9 });
    });
    // The shares are a distribution at every generation, not just the last.
    const drift = got.shares.reduce((worst, row) => {
      const tot = row.reduce((a, b) => a + b, 0);
      return Math.max(worst, Math.abs(tot - 1));
    }, 0);
    check("replicator shares sum to 1 (worst generation)", 1 + drift, 1,
          { absTol: 1e-9 });
    // The strategy order the page relies on must match the Python side's.
    check("strategy order", EP.STRATEGIES.join(","), G.strategies.join(","),
          { exact: true });
  }

  // -- 8. Monty Hall ----------------------------------------------------------
  for (const c of G.monty) {
    const p = c.params;
    group(`Monty Hall — ${p.doors} doors, ${p.opened} opened, know=${p.know}`);
    const got = EP.mhSummary(p);
    for (const key of Object.keys(c.expect)) {
      const isCount = key === "doors" || key === "opened";
      check(key, got[key], c.expect[key], isCount ? { exact: true } : { relTol: 1e-9 });
    }
    // Staying and switching-to-one-of-the-others must exhaust the win space.
    const others = p.doors - 1 - EP.mhBoard(p.doors, p.opened)[1];
    check("stay + others*switch = 1",
          got.stayProb + got.switchProb * others, 1, { absTol: 1e-9 });

    const kc = EP.mhKnowCurve(p.doors, p.opened, c.knowCurve.ks.length);
    c.knowCurve.switch.forEach((want, i) => {
      check(`know curve switch[${i}]`, kc.switchP[i], want, { relTol: 1e-9 });
    });
    c.knowCurve.stay.forEach((want, i) => {
      check(`know curve stay[${i}]`, kc.stayP[i], want, { relTol: 1e-9 });
    });
    const dc = EP.mhDoorsCurve(p.opened, Math.max(...c.doorsCurve.xs));
    c.doorsCurve.knowing.forEach((want, i) => {
      check(`doors curve knowing[${i}]`, dc.knowing[i], want, { relTol: 1e-9 });
    });
    c.doorsCurve.random.forEach((want, i) => {
      check(`doors curve random[${i}]`, dc.random[i], want, { relTol: 1e-9 });
    });
  }

  group("Seeded Monty Hall play-out — draw order must reproduce exactly");
  const mcfg = G.montySim.config;
  const msim = EP.simulateMonty(mcfg);
  check("valid games", msim.valid, G.montySim.valid, { exact: true });
  check("stay wins", msim.stayWins, G.montySim.stayWins, { exact: true });
  check("switch wins", msim.switchWins, G.montySim.switchWins, { exact: true });
  G.montySim.first.forEach((want, i) => {
    check(`game ${i + 1}: [car,pick,stay,switch]`, JSON.stringify(msim.first[i]),
          JSON.stringify(want), { exact: true });
  });

  // -- 9. Shannon's demon -------------------------------------------------------
  for (const c of G.shannon) {
    const p = c.params;
    group(`Shannon's demon — ${p.rounds} rounds, vol=${p.vol}, w=${p.w}, ` +
          `interval=${p.interval}, cost=${p.cost}`);
    const got = EP.sdSummary(p);
    const TIER_KEYS = { bestInterval: 1 };
    for (const key of Object.keys(c.expect)) {
      // A symmetric coin makes stockGrowth analytically zero, and a relative
      // bar blows up comparing two numbers that are each "zero plus floating-
      // point noise" -- the same reason probabilities elsewhere use absTol.
      const opts = TIER_KEYS[key] ? { exact: true }
        : Math.abs(c.expect[key]) < 1e-9 ? { absTol: 1e-9 }
        : { relTol: 1e-8 };
      check(key, got[key], c.expect[key], opts);
    }
    const [xs, gs] = EP.sdIntervalCurve(p.rounds, p.p, p.vol, p.w, p.cost, 30);
    c.intervalCurve.xs.forEach((want, i) => {
      check(`interval curve x[${i}]`, xs[i], want, { exact: true });
    });
    c.intervalCurve.gs.forEach((want, i) => {
      check(`interval curve g[${i}]`, gs[i], want, { relTol: 1e-8 });
    });
  }

  group("Seeded rebalancing walk — must reproduce exactly");
  const scfg = G.shannonSim.config;
  const ssim = EP.simulateRebalance(scfg);
  ["firstPrice", "firstHold", "firstRebal"].forEach((key) => {
    const arr = ssim[key.replace("first", "").toLowerCase()];
    G.shannonSim[key].forEach((want, t) => {
      check(`${key}[${t}]`, arr[t], want, { relTol: 1e-9 });
    });
  });
  G.shannonSim.termHold.forEach((want, i) => {
    check(`terminal hold ${i + 1}`, ssim.termHold[i], want, { relTol: 1e-9 });
  });
  G.shannonSim.termRebal.forEach((want, i) => {
    check(`terminal rebal ${i + 1}`, ssim.termRebal[i], want, { relTol: 1e-9 });
  });

  // -- 10. Insurance and risk pooling --------------------------------------
  for (const c of G.insurance) {
    const p = c.params;
    group(`Insurance — wealth=$${p.wealth}, seller=$${p.sellerWealth}, ` +
          `premium=$${p.premium}, loss=$${p.loss}, hazard=${p.hazard}`);
    const got = EP.insSummary(p);
    for (const key of Object.keys(c.expect)) {
      const isCount = key === "poolBreakEven";
      const isBool = key === "bandOk";
      check(key, got[key], c.expect[key],
            isCount || isBool ? { exact: true } : { relTol: 1e-8 });
    }
    const curve = EP.insPremiumCurve(p, c.premiumCurve.xs.length);
    c.premiumCurve.xs.forEach((want, i) => {
      check(`premium curve x[${i}]`, curve.xs[i], want, { relTol: 1e-9 });
    });
    c.premiumCurve.buyer.forEach((want, i) => {
      check(`premium curve buyer[${i}]`, curve.buyer[i], want, { relTol: 1e-8 });
    });
    c.premiumCurve.seller.forEach((want, i) => {
      check(`premium curve seller[${i}]`, curve.seller[i], want, { relTol: 1e-8 });
    });
    const pool = EP.insPoolCurve(p, c.poolCurve.sizes.length);
    c.poolCurve.growth.forEach((want, i) => {
      check(`pool curve growth[${i}]`, pool.growth[i], want, { relTol: 1e-8 });
    });
  }


  // -- 12. Parrondo's paradox ---------------------------------------------
  for (const c of G.parrondo) {
    const p = c.params;
    group(`Parrondo's paradox — q=${p.q}, eps=${p.eps}, pBad=${p.p_bad}, pGood=${p.p_good}`);
    const got = EP.paSummary({
      q: p.q, eps: p.eps, pBad: p.p_bad, pGood: p.p_good,
    });
    // Cramer's rule (JS) and np.linalg.lstsq (Python) are different
    // algorithms solving the same 3x3 system, so this is the same
    // different-numerical-path allowance Shannon's binomial-weight sums get.
    check("driftA", got.driftA, c.expect.driftA, { relTol: 1e-8 });
    check("driftB", got.driftB, c.expect.driftB, { relTol: 1e-8 });
    check("driftMix", got.driftMix, c.expect.driftMix, { relTol: 1e-8 });
    check("bestQ", got.bestQ, c.expect.bestQ, { relTol: 1e-8 });
    check("bestDrift", got.bestDrift, c.expect.bestDrift, { relTol: 1e-8 });
    check("paradox", got.paradox, c.expect.paradox, { exact: true });
    const [qs, drifts] = EP.paDriftCurve(p.eps, p.p_bad, p.p_good, 21);
    c.driftCurve.qs.forEach((want, i) => check(`drift curve q[${i}]`, qs[i], want,
      { exact: true }));
    c.driftCurve.drifts.forEach((want, i) => check(`drift curve drift[${i}]`,
      drifts[i], want, { relTol: 1e-8 }));
  }

  group("Seeded Parrondo walk — draw order must reproduce exactly");
  {
    const c = G.parrondoSim.config;
    const sim = EP.simulateParrondo({
      nPaths: c.n_paths, rounds: c.rounds, q: c.q, eps: c.eps,
      pBad: c.p_bad, pGood: c.p_good, w0: c.w0, seed: c.seed,
    });
    G.parrondoSim.firstA.forEach((want, i) =>
      check(`path A[${i}]`, sim.pathsA[0][i], want, { exact: true }));
    G.parrondoSim.firstB.forEach((want, i) =>
      check(`path B[${i}]`, sim.pathsB[0][i], want, { exact: true }));
    G.parrondoSim.firstMix.forEach((want, i) =>
      check(`path mix[${i}]`, sim.pathsMix[0][i], want, { exact: true }));
    G.parrondoSim.termA.forEach((want, i) =>
      check(`terminal A ${i + 1}`, sim.pathsA[i][sim.pathsA[i].length - 1], want,
        { exact: true }));
    G.parrondoSim.termB.forEach((want, i) =>
      check(`terminal B ${i + 1}`, sim.pathsB[i][sim.pathsB[i].length - 1], want,
        { exact: true }));
    G.parrondoSim.termMix.forEach((want, i) =>
      check(`terminal mix ${i + 1}`, sim.pathsMix[i][sim.pathsMix[i].length - 1],
        want, { exact: true }));
  }

  // -- 13. Base rates -------------------------------------------------------
  for (const c of G.baserates) {
    const p = c.params;
    group(`Base rates — prior=${p.prior}, sens=${p.sens}, spec=${p.spec}`);
    const got = EP.brSummary(p);
    for (const key of Object.keys(c.expect)) {
      check(key, got[key], c.expect[key], { relTol: 1e-9 });
    }
    const [xs, ys] = EP.brPrevalenceCurve(p.sens, p.spec, 40);
    c.prevalenceCurve.xs.forEach((want, i) =>
      check(`prevalence curve x[${i}]`, xs[i], want, { relTol: 1e-9 }));
    c.prevalenceCurve.ys.forEach((want, i) =>
      check(`prevalence curve y[${i}]`, ys[i], want, { relTol: 1e-9 }));
  }

  // -- 14. The birthday problem ----------------------------------------------
  for (const c of G.birthday) {
    const p = c.params;
    group(`Birthday problem — n=${p.n}, days=${p.days}, bits=${p.bits}`);
    const got = EP.bdSummary(p);
    check("collisionProb", got.collisionProb, c.expect.collisionProb, { relTol: 1e-9 });
    check("pairs", got.pairs, c.expect.pairs, { exact: true });
    check("halfLifeN", got.halfLifeN, c.expect.halfLifeN, { exact: true });
    // The hash-bits approximation is a closed-form sqrt, computed identically
    // in both languages, but still an APPROXIMATION of the true collision
    // count -- not a bit-exactness question, so it gets the tighter bar
    // anyway since there is no transcendental-approximation function involved.
    check("hashN50", got.hashN50, c.expect.hashN50, { relTol: 1e-9 });
    const [cxs, cys] = EP.bdCollisionCurve(p.days, 80);
    c.collisionCurve.xs.forEach((want, i) =>
      check(`collision curve x[${i}]`, cxs[i], want, { exact: true }));
    c.collisionCurve.ys.forEach((want, i) =>
      check(`collision curve y[${i}]`, cys[i], want, { relTol: 1e-9 }));
    const [bxs, bys] = EP.bdHashBitsCurve(8, 64, 20);
    c.hashBitsCurve.xs.forEach((want, i) =>
      check(`hash bits curve x[${i}]`, bxs[i], want, { relTol: 1e-9 }));
    c.hashBitsCurve.ys.forEach((want, i) =>
      check(`hash bits curve y[${i}]`, bys[i], want, { relTol: 1e-9 }));
  }

  // -- 15. The secretary problem ----------------------------------------------
  for (const c of G.secretary) {
    const p = c.params;
    group(`Secretary problem — s=${p.s}, n=${p.n}`);
    const got = EP.secSummary(p);
    for (const key of Object.keys(c.expect)) {
      check(key, got[key], c.expect[key], { relTol: 1e-9 });
    }
    const [xs, ys] = EP.secWinCurve(p.n);
    c.winCurve.xs.forEach((want, i) => check(`win curve x[${i}]`, xs[i], want,
      { exact: true }));
    c.winCurve.ys.forEach((want, i) => check(`win curve y[${i}]`, ys[i], want,
      { relTol: 1e-9 }));
  }

  group("Secretary problem — asymptotic convergence to 1/e");
  {
    const [ns, ys] = EP.secAsymptoticCurve(5, 500, 30);
    G.secretaryAsymptotic.ns.forEach((want, i) =>
      check(`n[${i}]`, ns[i], want, { exact: true }));
    G.secretaryAsymptotic.ys.forEach((want, i) =>
      check(`optimal P(win)[${i}]`, ys[i], want, { relTol: 1e-9 }));
  }

  // -- 16. The two-envelope paradox --------------------------------------------
  for (const c of G.twoenv) {
    const p = c.params;
    group(`Two-envelope paradox — x=${p.x}, rate=${p.rate}`);
    const got = EP.teSummary(p);
    check("pSmaller", got.pSmaller, c.expect.pSmaller, { relTol: 1e-9 });
    check("swapGain", got.swapGain, c.expect.swapGain, { relTol: 1e-9 });
    check("crossover", got.crossover, c.expect.crossover, { relTol: 1e-9 });
    check("meanSmaller", got.meanSmaller, c.expect.meanSmaller, { relTol: 1e-9 });
    check("shouldSwap", got.shouldSwap, c.expect.shouldSwap, { exact: true });
    const [gxs, ggains, gprobs] = EP.teGainCurve(p.rate, 40);
    c.gainCurve.xs.forEach((want, i) => check(`gain curve x[${i}]`, gxs[i], want,
      { relTol: 1e-9 }));
    c.gainCurve.gains.forEach((want, i) => check(`gain curve gain[${i}]`,
      ggains[i], want, { relTol: 1e-9 }));
    c.gainCurve.probs.forEach((want, i) => check(`gain curve prob[${i}]`,
      gprobs[i], want, { relTol: 1e-9 }));
  }

  // -- 17. Optional stopping ---------------------------------------------------
  // z_crit and everything downstream of it goes through normPpf, the same
  // Acklam-approximation family the wheel scenario already holds to a looser
  // bar than the PRNG-only checks above -- see CLAUDE.md's "two tolerance
  // classes" note.
  for (const c of G.optstop) {
    const p = c.params;
    group(`Optional stopping — looks=${p.looks}, batch=${p.batch}, alpha=${p.alpha}`);
    const got = EP.osSummary(p);
    check("cumFp", got.cumFp, c.expect.cumFp, { relTol: 1e-5 });
    check("nominalAlpha", got.nominalAlpha, c.expect.nominalAlpha, { exact: true });
    check("bonferroniAlpha", got.bonferroniAlpha, c.expect.bonferroniAlpha,
      { exact: true });
    check("totalN", got.totalN, c.expect.totalN, { exact: true });
    check("zCrit", got.zCrit, c.expect.zCrit, { relTol: 1e-6 });
    const [xs, ys] = EP.osFalsePositiveCurve(p.looks, p.batch, p.alpha);
    c.fpCurve.xs.forEach((want, i) => check(`FP curve x[${i}]`, xs[i], want,
      { exact: true }));
    c.fpCurve.ys.forEach((want, i) => check(`FP curve y[${i}]`, ys[i], want,
      { relTol: 1e-5 }));
  }

  group("Seeded optional-stopping walk — draw order must reproduce exactly");
  {
    const c = G.optstopSim.config;
    const sim = EP.simulateOptionalStopping({
      nPaths: c.n_paths, looks: c.looks, batch: c.batch, alpha: c.alpha,
      seed: c.seed,
    });
    G.optstopSim.zPaths.forEach((wantPath, pi) => {
      wantPath.forEach((want, i) => {
        // The z-statistic itself is exact PRNG arithmetic (no normPpf in its
        // own computation -- only the boundary comparison uses it), so this
        // stays at the tight bar.
        check(`path ${pi + 1} z[${i}]`, sim.allZ[pi][i], want, { relTol: 1e-9 });
      });
    });
    G.optstopSim.firstSig.forEach((want, i) => {
      check(`path ${i + 1} first significant look`, sim.firstSig[i], want,
        { exact: true });
    });
  }

  group("Simpson's paradox — closed forms, counts and the reversal curve");
  for (const c of G.simpsons) {
    const p = c.params;
    const got = EP.simpsonsSummary(p);
    for (const k of Object.keys(c.expect)) {
      if (k === "counts") continue;
      check(`d=${p.delta} wA=${p.wA} ${k}`, got[k], c.expect[k],
        typeof c.expect[k] === "boolean" ? { exact: true } : { relTol: 1e-9 });
    }
    if (c.counts) {
      for (const k of Object.keys(c.counts)) {
        check(`d=${p.delta} counts.${k}`, got.counts[k], c.counts[k],
          { relTol: 1e-9 });
      }
    }
    if (c.deltaCurve) {
      const [xs, ys] = EP.simpsonsDeltaCurve(p.pEasy, p.pHard, p.wA, p.wB, 41);
      c.deltaCurve.xs.forEach((w, i) =>
        check(`d=${p.delta} delta curve x[${i}]`, xs[i], w, { relTol: 1e-9 }));
      c.deltaCurve.ys.forEach((w, i) =>
        check(`d=${p.delta} delta curve y[${i}]`, ys[i], w, { relTol: 1e-9 }));
    }
  }

  group("Bertrand's paradox — three closed forms, both curves, seeded chords");
  for (const c of G.bertrand) {
    const p = c.params;
    const got = EP.bertrandSummary(p);
    for (const k of Object.keys(c.expect)) {
      check(`c=${p.c.toFixed(3)} ${k}`, got[k], c.expect[k],
        typeof c.expect[k] === "boolean" ? { exact: true } : { relTol: 1e-9 });
    }
    if (c.cdfCurve) {
      const [ts, ce, cr, cm] = EP.bertrandCdfCurve(41);
      c.cdfCurve.ts.forEach((w, i) =>
        check(`cdf t[${i}]`, ts[i], w, { relTol: 1e-9 }));
      c.cdfCurve.endpoints.forEach((w, i) =>
        check(`cdf endpoints[${i}]`, ce[i], w, { relTol: 1e-9 }));
      c.cdfCurve.radius.forEach((w, i) =>
        check(`cdf radius[${i}]`, cr[i], w, { relTol: 1e-9 }));
      c.cdfCurve.midpoint.forEach((w, i) =>
        check(`cdf midpoint[${i}]`, cm[i], w, { relTol: 1e-9 }));
    }
    if (c.cCurve) {
      const [cs, pe, prr, pm] = EP.bertrandCCurve(41);
      c.cCurve.cs.forEach((w, i) =>
        check(`c curve c[${i}]`, cs[i], w, { relTol: 1e-9 }));
      c.cCurve.endpoints.forEach((w, i) =>
        check(`c curve endpoints[${i}]`, pe[i], w, { relTol: 1e-9 }));
      c.cCurve.radius.forEach((w, i) =>
        check(`c curve radius[${i}]`, prr[i], w, { relTol: 1e-9 }));
      c.cCurve.midpoint.forEach((w, i) =>
        check(`c curve midpoint[${i}]`, pm[i], w, { relTol: 1e-9 }));
    }
    if (c.samples) {
      for (const m of Object.keys(c.samples)) {
        const got2 = EP.bertrandSample(m, c.samples[m].length, p.radius, p.c, p.seed);
        c.samples[m].forEach((w, i) => {
          for (const f of ["x1", "y1", "x2", "y2", "mx", "my", "u", "length"]) {
            check(`sample ${m}[${i}].${f}`, got2[i][f], w[f], { relTol: 1e-9 });
          }
          check(`sample ${m}[${i}].long`, got2[i].long, w.long, { exact: true });
        });
      }
    }
  }

  // -- summary --------------------------------------------------------------
  const s = document.getElementById("summary");
  s.textContent = failed === 0
    ? `All ${n} checks pass — the JS engine matches the Python source of truth.`
    : `${failed} of ${n} checks FAILED (${passed} passed). See the table and the console.`;
  s.className = failed === 0 ? "pass" : "fail";
})();
</script>
</body>
</html>
