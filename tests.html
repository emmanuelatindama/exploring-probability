<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine tests — Exploring Probability</title>
<style>
  :root {
    color-scheme: light dark;
    --surface: #fcfcfb; --ink: #0b0b0b; --dim: #52514e; --line: #e1e0d9;
    --ok: #0ca30c; --bad: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --surface: #1a1a19; --ink: #fff; --dim: #c3c2b7; --line: #2c2c2a; }
  }
  body {
    margin: 0; background: var(--surface); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 32px 24px 64px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--dim); margin: 0 0 24px; }
  #summary { font-size: 16px; font-weight: 600; padding: 12px 0 18px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) {
    text-align: left; font-variant-numeric: normal;
  }
  thead th { color: var(--dim); font-weight: 500; }
  .pass { color: var(--ok); font-weight: 600; }
  .fail { color: var(--bad); font-weight: 600; }
  tr.group td { padding-top: 18px; font-weight: 600; border-bottom: none; }
  code { font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Engine tests</h1>
  <p class="sub">
    Checks <code>js/engine.js</code> against golden values generated by
    <code>lab/analytics.py</code> (regenerate with <code>python lab/verify.py</code>).
    The PRNG must match exactly — the two implementations only produce the same
    trajectories if the port is bit-for-bit correct.
  </p>
  <div id="summary">Running…</div>
  <table>
    <thead>
      <tr><th>#</th><th>Check</th><th>Got</th><th>Want</th><th>Δ (rel)</th><th>Result</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script src="js/engine.js"></script>
<script src="js/golden.js"></script>
<script>
(function () {
  "use strict";
  const G = window.EP_GOLDEN;
  const rows = document.getElementById("rows");
  let n = 0, passed = 0, failed = 0;

  const td = (text, cls) => {
    const c = document.createElement("td");
    c.textContent = text;
    if (cls) c.className = cls;
    return c;
  };

  function group(label) {
    const tr = document.createElement("tr");
    tr.className = "group";
    const c = document.createElement("td");
    c.colSpan = 6;
    c.textContent = label;
    tr.appendChild(c);
    rows.appendChild(tr);
  }

  const fmt = (v) =>
    typeof v !== "number" ? String(v)
      : !isFinite(v) ? String(v)
      : (Math.abs(v) >= 1e6 || (Math.abs(v) > 0 && Math.abs(v) < 1e-4))
        ? v.toExponential(10) : String(Number(v.toPrecision(12)));

  /** relTol compares relatively; absTol absolutely; exact demands equality. */
  function check(label, got, want, opts) {
    opts = opts || {};
    n++;
    let ok, delta;
    if (opts.exact) {
      ok = got === want;
      delta = ok ? 0 : NaN;
    } else if (opts.absTol !== undefined) {
      delta = Math.abs(got - want);
      ok = delta <= opts.absTol;
    } else {
      const tol = opts.relTol !== undefined ? opts.relTol : 1e-9;
      const scale = Math.max(Math.abs(want), Number.MIN_VALUE);
      delta = Math.abs(got - want) / scale;
      ok = delta <= tol;
      if (!isFinite(want) && want === got) { ok = true; delta = 0; }
    }
    ok ? passed++ : failed++;

    const tr = document.createElement("tr");
    tr.appendChild(td(String(n)));
    tr.appendChild(td(label));
    tr.appendChild(td(fmt(got)));
    tr.appendChild(td(fmt(want)));
    tr.appendChild(td(isFinite(delta) ? delta.toExponential(2) : "—"));
    tr.appendChild(td(ok ? "PASS" : "FAIL", ok ? "pass" : "fail"));
    rows.appendChild(tr);
    if (!ok) console.error(`FAIL ${label}: got`, got, "want", want);
  }

  // -- 1. PRNG: must be bit-for-bit identical to the Python port -------------
  group("PRNG (mulberry32) — exact match required");
  for (const seed of Object.keys(G.prng)) {
    const rand = EP.mulberry32(Number(seed));
    G.prng[seed].forEach((want, i) => {
      check(`seed ${seed}, draw ${i + 1}`, rand(), want, { exact: true });
    });
  }

  // -- 2. binomial helpers ---------------------------------------------------
  group("Binomial pmf / cdf vs scipy");
  for (const b of G.binom) {
    check(`pmf(k=${b.k}, n=${b.n}, p=${b.p})`, EP.binomPmf(b.k, b.n, b.p), b.pmf,
          { relTol: 1e-10 });
    check(`cdf(k=${b.k}, n=${b.n}, p=${b.p})`, EP.binomCdf(b.k, b.n, b.p), b.cdf,
          { relTol: 1e-10 });
  }

  // -- 3. closed-form analytics ---------------------------------------------
  for (const c of G.cases) {
    const p = c.params;
    group(`Analytics — rounds=${p.rounds} p=${p.p} up=${p.up} down=${p.down} f=${p.f}`);
    const got = EP.summary(p);
    for (const key of Object.keys(c.expect)) {
      // Probabilities get an absolute tolerance: some are ~1e-9, where a
      // relative bar would just measure floating-point noise.
      const isProb = key === "pBelowStart" || key === "pBelowOne";
      check(key, got[key], c.expect[key],
            isProb ? { absTol: 1e-10 } : { relTol: 1e-9 });
    }
  }

  // -- 4. seeded simulation: the PRNG port end to end -----------------------
  group("Seeded simulation — terminal wealth must reproduce exactly");
  const cfg = G.sim.config;
  const sim = EP.simulatePaths(cfg);
  G.sim.terminal.forEach((want, i) => {
    check(`path ${i + 1} terminal`, sim.terminal[i], want, { relTol: 1e-12 });
  });
  G.sim.firstPath.forEach((want, t) => {
    check(`path 1, round ${t}`, sim.paths[t], want, { relTol: 1e-12 });
  });

  // -- 5. gambler's ruin ----------------------------------------------------
  for (const c of G.ruin) {
    const p = c.params;
    group(`Gambler's ruin — $${p.bankroll} → $${p.target}, $${p.bet} bets, p=${p.p}`);
    const got = EP.ruinSummary(p);
    for (const key of Object.keys(c.expect)) {
      const isProb = /Prob|Unbounded/.test(key);
      check(key, got[key], c.expect[key],
            isProb ? { absTol: 1e-12 } : { relTol: 1e-9 });
    }
    // Absorption is certain: the two exits must exhaust the probability.
    check("ruin + reach = 1", got.ruinProb + got.reachProb, 1, { absTol: 1e-12 });
  }

  group("Seeded ruin walk — absorbing barriers must line up exactly");
  const rcfg = G.ruinSim.config;
  const rsim = EP.simulateRuin(rcfg);
  check("k (start, in bets)", rsim.k, G.ruinSim.k, { exact: true });
  check("n (target, in bets)", rsim.n, G.ruinSim.n, { exact: true });
  G.ruinSim.terminal.forEach((want, i) => {
    check(`walk ${i + 1} terminal`, rsim.terminal[i], want, { exact: true });
  });
  G.ruinSim.firstPath.forEach((want, t) => {
    check(`walk 1, round ${t}`, rsim.paths[t], want, { exact: true });
  });

  // -- 6. St Petersburg -----------------------------------------------------
  for (const c of G.stpete) {
    const p = c.params;
    group(`St Petersburg — p=${p.p}, m=${p.m}, cap ${p.tiers} tosses (m·p=${(p.m * p.p).toFixed(2)})`);
    const got = EP.spSummary(p);
    // The two tier-indexed values are not summary fields -- they are the
    // per-tier functions the octave chart calls, so check them at their source.
    const TIER_KEYS = { survival5: 1, contribution5: 1 };
    for (const key of Object.keys(c.expect)) {
      if (TIER_KEYS[key]) continue;
      // `expected` is +Infinity for the divergent cases; check() handles that
      // via its non-finite equality branch.
      check(key, got[key], c.expect[key], { relTol: 1e-9 });
    }
    check("survival(tier 5)", EP.spSurvival(5, p.p), c.expect.survival5,
          { relTol: 1e-9 });
    check("tierContribution(tier 5)", EP.spTierContribution(5, p.p, p.m),
          c.expect.contribution5, { relTol: 1e-9 });
  }

  group("Seeded St Petersburg play-out — payout draws must reproduce exactly");
  const spcfg = G.stpeteSim.config;
  const spsim = EP.simulateStPetersburg(spcfg);
  G.stpeteSim.firstPayouts.forEach((want, i) => {
    check(`payout ${i + 1}`, spsim.firstPayouts[i], want, { exact: true });
  });
  G.stpeteSim.means.forEach((want, i) => {
    check(`run ${i + 1} mean over ${spcfg.plays} plays`, spsim.means[i], want,
          { relTol: 1e-12 });
  });

  // -- 7. iterated prisoner's dilemma ---------------------------------------
  for (const c of G.pd) {
    const p = c.params;
    group(`Prisoner's dilemma — ${p.rounds} rounds, T=${p.t}, noise=${p.noise}`);
    const got = EP.pdSummary(p);
    G.strategies.forEach((si, i) => {
      G.strategies.forEach((sj, j) => {
        check(`A[${si}][${sj}]`, got.matrix[i][j], c.expect.matrix[i][j],
              { relTol: 1e-9 });
      });
    });
    c.expect.scores.forEach((want, i) => {
      check(`score ${G.strategies[i]}`, got.scores[i], want, { relTol: 1e-9 });
    });
    check("tournament winner", got.winner, c.expect.winner, { exact: true });
    check("TFT vs ALLD", got.tftVsAlld, c.expect.tftVsAlld, { relTol: 1e-9 });
    check("ALLD vs TFT", got.alldVsTft, c.expect.alldVsTft, { relTol: 1e-9 });
    c.expect.finalShares.forEach((want, i) => {
      check(`share after ${p.generations} gens — ${G.strategies[i]}`,
            got.shares[got.shares.length - 1][i], want, { absTol: 1e-9 });
    });
    // The shares are a distribution at every generation, not just the last.
    const drift = got.shares.reduce((worst, row) => {
      const tot = row.reduce((a, b) => a + b, 0);
      return Math.max(worst, Math.abs(tot - 1));
    }, 0);
    check("replicator shares sum to 1 (worst generation)", 1 + drift, 1,
          { absTol: 1e-9 });
    // The strategy order the page relies on must match the Python side's.
    check("strategy order", EP.STRATEGIES.join(","), G.strategies.join(","),
          { exact: true });
  }

  // -- 8. Monty Hall ----------------------------------------------------------
  for (const c of G.monty) {
    const p = c.params;
    group(`Monty Hall — ${p.doors} doors, ${p.opened} opened, know=${p.know}`);
    const got = EP.mhSummary(p);
    for (const key of Object.keys(c.expect)) {
      const isCount = key === "doors" || key === "opened";
      check(key, got[key], c.expect[key], isCount ? { exact: true } : { relTol: 1e-9 });
    }
    // Staying and switching-to-one-of-the-others must exhaust the win space.
    const others = p.doors - 1 - EP.mhBoard(p.doors, p.opened)[1];
    check("stay + others*switch = 1",
          got.stayProb + got.switchProb * others, 1, { absTol: 1e-9 });

    const kc = EP.mhKnowCurve(p.doors, p.opened, c.knowCurve.ks.length);
    c.knowCurve.switch.forEach((want, i) => {
      check(`know curve switch[${i}]`, kc.switchP[i], want, { relTol: 1e-9 });
    });
    c.knowCurve.stay.forEach((want, i) => {
      check(`know curve stay[${i}]`, kc.stayP[i], want, { relTol: 1e-9 });
    });
    const dc = EP.mhDoorsCurve(p.opened, Math.max(...c.doorsCurve.xs));
    c.doorsCurve.knowing.forEach((want, i) => {
      check(`doors curve knowing[${i}]`, dc.knowing[i], want, { relTol: 1e-9 });
    });
    c.doorsCurve.random.forEach((want, i) => {
      check(`doors curve random[${i}]`, dc.random[i], want, { relTol: 1e-9 });
    });
  }

  group("Seeded Monty Hall play-out — draw order must reproduce exactly");
  const mcfg = G.montySim.config;
  const msim = EP.simulateMonty(mcfg);
  check("valid games", msim.valid, G.montySim.valid, { exact: true });
  check("stay wins", msim.stayWins, G.montySim.stayWins, { exact: true });
  check("switch wins", msim.switchWins, G.montySim.switchWins, { exact: true });
  G.montySim.first.forEach((want, i) => {
    check(`game ${i + 1}: [car,pick,stay,switch]`, JSON.stringify(msim.first[i]),
          JSON.stringify(want), { exact: true });
  });

  // -- 9. Shannon's demon -------------------------------------------------------
  for (const c of G.shannon) {
    const p = c.params;
    group(`Shannon's demon — ${p.rounds} rounds, vol=${p.vol}, w=${p.w}, ` +
          `interval=${p.interval}, cost=${p.cost}`);
    const got = EP.sdSummary(p);
    const TIER_KEYS = { bestInterval: 1 };
    for (const key of Object.keys(c.expect)) {
      // A symmetric coin makes stockGrowth analytically zero, and a relative
      // bar blows up comparing two numbers that are each "zero plus floating-
      // point noise" -- the same reason probabilities elsewhere use absTol.
      const opts = TIER_KEYS[key] ? { exact: true }
        : Math.abs(c.expect[key]) < 1e-9 ? { absTol: 1e-9 }
        : { relTol: 1e-8 };
      check(key, got[key], c.expect[key], opts);
    }
    const [xs, gs] = EP.sdIntervalCurve(p.rounds, p.p, p.vol, p.w, p.cost, 30);
    c.intervalCurve.xs.forEach((want, i) => {
      check(`interval curve x[${i}]`, xs[i], want, { exact: true });
    });
    c.intervalCurve.gs.forEach((want, i) => {
      check(`interval curve g[${i}]`, gs[i], want, { relTol: 1e-8 });
    });
  }

  group("Seeded rebalancing walk — must reproduce exactly");
  const scfg = G.shannonSim.config;
  const ssim = EP.simulateRebalance(scfg);
  ["firstPrice", "firstHold", "firstRebal"].forEach((key) => {
    const arr = ssim[key.replace("first", "").toLowerCase()];
    G.shannonSim[key].forEach((want, t) => {
      check(`${key}[${t}]`, arr[t], want, { relTol: 1e-9 });
    });
  });
  G.shannonSim.termHold.forEach((want, i) => {
    check(`terminal hold ${i + 1}`, ssim.termHold[i], want, { relTol: 1e-9 });
  });
  G.shannonSim.termRebal.forEach((want, i) => {
    check(`terminal rebal ${i + 1}`, ssim.termRebal[i], want, { relTol: 1e-9 });
  });

  // -- 10. Insurance and risk pooling --------------------------------------
  for (const c of G.insurance) {
    const p = c.params;
    group(`Insurance — wealth=$${p.wealth}, seller=$${p.sellerWealth}, ` +
          `premium=$${p.premium}, loss=$${p.loss}, hazard=${p.hazard}`);
    const got = EP.insSummary(p);
    for (const key of Object.keys(c.expect)) {
      const isCount = key === "poolBreakEven";
      const isBool = key === "bandOk";
      check(key, got[key], c.expect[key],
            isCount || isBool ? { exact: true } : { relTol: 1e-8 });
    }
    const curve = EP.insPremiumCurve(p, c.premiumCurve.xs.length);
    c.premiumCurve.xs.forEach((want, i) => {
      check(`premium curve x[${i}]`, curve.xs[i], want, { relTol: 1e-9 });
    });
    c.premiumCurve.buyer.forEach((want, i) => {
      check(`premium curve buyer[${i}]`, curve.buyer[i], want, { relTol: 1e-8 });
    });
    c.premiumCurve.seller.forEach((want, i) => {
      check(`premium curve seller[${i}]`, curve.seller[i], want, { relTol: 1e-8 });
    });
    const pool = EP.insPoolCurve(p, c.poolCurve.sizes.length);
    c.poolCurve.growth.forEach((want, i) => {
      check(`pool curve growth[${i}]`, pool.growth[i], want, { relTol: 1e-8 });
    });
  }

  // -- 11. The wheel strategy ------------------------------------------------
  // Phi and its inverse are rational approximations here, not scipy's exact
  // routines -- so this section uses a 1e-6 bar rather than the 1e-8/1e-9 the
  // other closed forms hold to, a deliberately looser, explicitly-chosen
  // tolerance rather than one inferred from magnitude. The PRNG-derived
  // pieces (the normal generator, the simulated paths) still demand exact
  // bit-for-bit equality, same as mulberry32 itself.
  group("The wheel — Black-Scholes prices and real-world ITM probabilities");
  for (const c of G.wheelBs) {
    const p = c.params;
    // d1/d2 are plain log/sqrt arithmetic -- no Phi anywhere in them -- so
    // they hold to the tight bar. Everything downstream of them calls normCdf
    // (Abramowitz-Stegun, ~1.5e-7 absolute error in Phi itself), which a
    // price of order 100 turns into a relative price error around 1e-6; 1e-5
    // leaves headroom without hiding a real regression.
    const [d1, d2] = EP.bsD1D2(p.s, p.k, p.t, p.sigma, p.r, p.q);
    check(`d1 s=${p.s} k=${p.k} t=${p.t}`, d1, c.expect.d1, { relTol: 1e-9 });
    check(`d2 s=${p.s} k=${p.k} t=${p.t}`, d2, c.expect.d2, { relTol: 1e-9 });
    check(`call price s=${p.s} k=${p.k} t=${p.t}`,
          EP.bsCallPrice(p.s, p.k, p.t, p.sigma, p.r, p.q), c.expect.callPrice,
          { relTol: 1e-5 });
    check(`put price s=${p.s} k=${p.k} t=${p.t}`,
          EP.bsPutPrice(p.s, p.k, p.t, p.sigma, p.r, p.q), c.expect.putPrice,
          { relTol: 1e-5 });
    check(`real-world call ITM prob s=${p.s} k=${p.k} t=${p.t}`,
          EP.realWorldItmProb(p.s, p.k, p.t, p.sigma, p.mu, p.q, true),
          c.expect.realWorldCallProb, { relTol: 1e-5 });
    check(`real-world put ITM prob s=${p.s} k=${p.k} t=${p.t}`,
          EP.realWorldItmProb(p.s, p.k, p.t, p.sigma, p.mu, p.q, false),
          c.expect.realWorldPutProb, { relTol: 1e-5 });
  }

  group("The wheel — buy-and-hold's exact terminal distribution");
  for (const c of G.hold) {
    const got = EP.holdSummary(c.params);
    // growthRate/expectedFinal/medianFinal are plain exp/log, no Phi; the two
    // quantile fields additionally go through normPpf (Acklam, ~2.6e-9
    // relative) and pBelowStart through normCdf -- all comfortably inside
    // the same 1e-5 bar the price checks above use, so one tolerance covers
    // the whole group without hiding which fields are actually exact.
    for (const key of Object.keys(c.expect)) {
      check(key, got[key], c.expect[key], { relTol: 1e-5 });
    }
  }

  group("The wheel — normal draws must reproduce exactly (Box-Muller on mulberry32)");
  for (const seed of Object.keys(G.normals)) {
    const randn = EP.makeNormalGenerator(Number(seed));
    G.normals[seed].forEach((want, i) => {
      check(`seed ${seed}, normal draw ${i + 1}`, randn(), want, { exact: true });
    });
  }

  group("The wheel — seeded family simulation must reproduce exactly");
  {
    const wc = G.wheelSim.config;
    const pr = {
      w0: wc.w0, s0: wc.s0, mu: wc.mu, sigmaRv: wc.sigmaRv, sigmaIv: wc.sigmaIv,
      r: wc.r, q: wc.q, years: wc.years, xMonths: wc.xMonths, yMonths: wc.yMonths,
      dipPct: wc.dipPct, sellHaircut: wc.sellHaircut,
      shareSl: wc.shareSl, callTp: wc.callTp, stockFeePct: wc.stockFeePct,
      optFee: wc.optFee, seed: wc.seed,
    };
    const fam = EP.simulateWheelFamily(pr);
    // path/dip/hold never call normCdf -- pure GBM and pure arithmetic on it
    // -- so they hold to the PRNG's own bit-parity-adjacent bar. wheel and
    // puts-only price and mark options every day the cohort is open, so each
    // one's Phi-approximation error compounds through the day-by-day cash
    // flow rather than cancelling; 1e-5 is the same bar the BS prices
    // themselves are held to above, not a separately-chosen number.
    G.wheelSim.path.forEach((want, i) => {
      check(`path[${i}]`, fam.path[i], want, { relTol: 1e-9 });
    });
    G.wheelSim.wheelEquity.forEach((want, i) => {
      check(`wheel equity[${i}]`, fam.wheel.equity[i], want, { relTol: 1e-5 });
    });
    G.wheelSim.putsOnlyEquity.forEach((want, i) => {
      check(`puts-only equity[${i}]`, fam.putsOnly.equity[i], want, { relTol: 1e-5 });
    });
    G.wheelSim.dipEquity.forEach((want, i) => {
      check(`dip equity[${i}]`, fam.dip[i], want, { relTol: 1e-9 });
    });
    G.wheelSim.holdEquity.forEach((want, i) => {
      check(`hold equity[${i}]`, fam.hold[i], want, { relTol: 1e-9 });
    });
    for (const key of Object.keys(G.wheelSim.wheelStats)) {
      const jsKey = key.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
      check(`stats.${jsKey}`, fam.wheel.stats[jsKey], G.wheelSim.wheelStats[key],
            { exact: true });
    }
    check("event count", fam.wheel.events.length, G.wheelSim.wheelEvents.length,
          { exact: true });
    G.wheelSim.wheelEvents.forEach((want, i) => {
      const got = fam.wheel.events[i];
      check(`event[${i}] day`, got.t, want.t, { exact: true });
      check(`event[${i}] kind`, got.kind, want.kind, { exact: true });
      check(`event[${i}] contracts`, got.contracts, want.contracts, { exact: true });
    });
  }

  group("The wheel — the IV-RV sweep loop must reproduce exactly");
  {
    const sc = G.wheelSweep.config;
    const pr = {
      w0: sc.w0, s0: sc.s0, mu: sc.mu, sigmaRv: sc.sigmaRv, r: sc.r, q: sc.q,
      years: sc.years, xMonths: sc.xMonths, yMonths: sc.yMonths,
      dipPct: sc.dipPct, sellHaircut: sc.sellHaircut,
      shareSl: sc.shareSl, callTp: sc.callTp, stockFeePct: sc.stockFeePct,
      optFee: sc.optFee, points: sc.points, nSeeds: sc.nSeeds,
      spreadLo: sc.spreadLo, spreadHi: sc.spreadHi, baseSeed: sc.baseSeed,
    };
    const sweep = EP.wheelIvSweep(pr);
    G.wheelSweep.xs.forEach((want, i) => {
      check(`sweep xs[${i}]`, sweep.xs[i], want, { relTol: 1e-9 });
    });
    G.wheelSweep.gs.forEach((want, i) => {
      // Each point averages several full wheel-family runs, so the per-step
      // Phi-approximation error compounds further than a single equity
      // curve's -- observed up to ~2e-5, so 5e-5 leaves real margin.
      check(`sweep gs[${i}]`, sweep.gs[i], want, { relTol: 5e-5 });
    });
  }

  // -- summary --------------------------------------------------------------
  const s = document.getElementById("summary");
  s.textContent = failed === 0
    ? `All ${n} checks pass — the JS engine matches the Python source of truth.`
